name: fakhri

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fakhri
      POSTGRES_PASSWORD: fakhri_dev
      POSTGRES_DB: fakhri
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fakhri -d fakhri"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Upstream stopped publishing Community Edition images in 2025.
    # pgsty/minio is the maintained, multi-arch, drop-in community fork.
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fakhri
      MINIO_ROOT_PASSWORD: fakhri_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://fakhri:fakhri_dev@postgres:5432/fakhri
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3001
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  pgdata: {}
  miniodata: {}